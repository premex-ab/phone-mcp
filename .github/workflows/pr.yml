name: PR

on:
  pull_request:

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: tart

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build Full Debug APK
      run: ./gradlew assembleFullDebug --stacktrace

    - name: Run lint
      run: ./gradlew lint

    - name: Run unit tests
      run: ./gradlew test

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: build-outputs
        path: |
          app/build/outputs/
          app/build/reports/
        retention-days: 7
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build
    steps:
      - name: Check results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
