name: Publish Play listing

# Pushes app/src/main/play/** (store texts + graphics, all locales) to the
# Play Console via Gradle Play Publisher. Manual trigger: listings change
# rarely and independently of code releases.

on:
  workflow_dispatch: {}

concurrency:
  group: publish-listing
  cancel-in-progress: false

jobs:
  listing:
    environment: release
    runs-on: tart

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Create Play credentials
        run: |
          echo "${{ secrets.PLAY_STORE_PUBLISHER_BASE64 }}" | base64 --decode > app/byggappen-dev-b151ea2d4990.json

      - name: Publish listing to Play Console
        run: ./gradlew publishPlayReleaseListing --stacktrace
